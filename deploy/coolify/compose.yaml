name: survey

services:
  survey-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/erland/survey-backend}:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:?Set DB_HOST in Coolify}:${DB_PORT:-5432}/${DB_NAME:-survey}
      DB_USERNAME: ${DB_USERNAME:-survey}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      ADMIN_COOKIE_SECURE: "true"
      PRESENTATION_TOKEN_HOURS: ${PRESENTATION_TOKEN_HOURS:-12}
      HTTP_MAX_BODY_SIZE: ${HTTP_MAX_BODY_SIZE:-1M}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-600}
      RATE_LIMIT_PRESENTATION_PER_MINUTE: ${RATE_LIMIT_PRESENTATION_PER_MINUTE:-600}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/q/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  survey-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/erland/survey-frontend}:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      SURVEY_BACKEND_HOST: survey-backend
    depends_on:
      survey-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
