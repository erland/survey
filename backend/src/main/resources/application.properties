quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.smallrye-health.root-path=/q/health

# PostgreSQL datasource. Environment variables can override all defaults.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:survey}
quarkus.datasource.password=${DB_PASSWORD:survey}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/survey}

# Keep the pool deliberately small for the MVP bootstrap.
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

# Flyway owns schema changes from the first migration onward.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration

# Local MVP admin authentication. In production, set bootstrap credentials only
# when creating the first admin and use HTTPS so the cookie can remain Secure.
app.auth.session-hours=${ADMIN_SESSION_HOURS:12}
app.auth.cookie-secure=${ADMIN_COOKIE_SECURE:true}
app.bootstrap-admin.username=${ADMIN_BOOTSTRAP_USER:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Deterministic credentials for backend integration tests only.
%test.app.auth.cookie-secure=false
%test.app.bootstrap-admin.username=test-admin
%test.app.bootstrap-admin.password=test-password-123

# JPA uses Flyway-managed schema and validates mappings against it.
quarkus.hibernate-orm.database.generation=validate

# Read-only presentation links are intentionally short-lived and revocable.
app.presentation.token-hours=${PRESENTATION_TOKEN_HOURS:12}

# Security hardening. The body limit protects JSON/import endpoints from oversized requests.
quarkus.http.limits.max-body-size=${HTTP_MAX_BODY_SIZE:1M}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
app.security.rate-limit.public-per-minute=${RATE_LIMIT_PUBLIC_PER_MINUTE:600}
app.security.rate-limit.presentation-per-minute=${RATE_LIMIT_PRESENTATION_PER_MINUTE:600}

# Tests should not become order-dependent because of the in-memory request limiter.
%test.app.security.rate-limit.enabled=false
