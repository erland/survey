name: Publish Docker images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve image names and version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"

          if [ -z "$version" ]; then
            echo "Release tag must contain a version." >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          repository="${repository,,}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/$owner/$repository-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/$owner/$repository-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.release.outputs.backend_image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.release.outputs.frontend_image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish summary
        run: |
          {
            echo "## Docker images"
            echo
            echo "- \`${{ steps.release.outputs.backend_image }}:${{ steps.release.outputs.version }}\`"
            echo "- \`${{ steps.release.outputs.frontend_image }}:${{ steps.release.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
