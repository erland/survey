project: survey-service
mode: CREATE
current_step: STEP-42
current_step_name: Account selection and admin UX
status: implemented_ci_verified
completed_through: STEP-42
release_baseline: 1.0.0
verification_policy:
  local_static: required
  runtime: required_for_code_steps
history_summary:
  - STEP-01..03: bootstrap, CI, PostgreSQL and Flyway
  - STEP-04..08: admin authentication, survey domain/API and editor
  - STEP-09..13: survey-run snapshot, lifecycle, public lookup and sharing
  - STEP-14..18: anonymous participant session, participant UI, autosave, submit and heartbeat
  - STEP-19..25: result aggregation, live/SSE, charts, free text, presentation and read-only token
  - STEP-26..30: survey/result import-export and complete archival package
  - STEP-31..33: UX, accessibility and security hardening
  - STEP-34: Playwright end-to-end coverage and CI E2E job
  - STEP-35: production and Coolify deployment profiles
  - STEP-36: release candidate / first production release
  - STEP-37: multi-user account architecture and migration plan
step_38:
  changes:
    - Flyway V8 adds survey_account and survey_account_admin
    - admin_user gains system_admin and active
    - survey gains mandatory survey_account_id and created_by_admin_user_id
    - existing surveys migrate to an initial Default account
    - existing admins are linked to the initial account during migration
    - configured bootstrap admin is promoted to system_admin and linked to the initial account on startup
    - new and copied surveys receive survey_account_id while legacy owner_id remains temporarily
    - inactive admin users are rejected by login/session authentication
    - Panache domain entities and repositories added for survey accounts and memberships
  transition:
    - owner_id remains until STEP-39 moves authorization to account membership
    - public participant behavior is unchanged
  verification:
    - migration schema tests added
    - survey account persistence tests added
    - bootstrap system-admin membership test added
    - CI run 39 passed backend, frontend and end-to-end
step_39:
  changes:
    - central AccountAccessService enforces survey-account membership
    - legacy admin APIs resolve exactly one account and reject ambiguous multi-account sessions
    - account-scoped survey API added under /api/admin/accounts/{accountId}/surveys
    - account-scoped run/result/export/presentation/live APIs added under /api/admin/accounts/{accountId}/runs
    - survey CRUD authorization moved from owner_id to survey_account membership
    - run creation/lifecycle/read authorization moved to survey_account membership
    - result and export authorization moved to survey_account membership
    - presentation-token administration moved to survey_account membership
    - cross-account integration test added with two independent survey accounts
  compatibility:
    - existing /api/admin routes remain functional for users with exactly one account
    - users with multiple accounts receive ACCOUNT_SELECTION_REQUIRED on legacy routes
    - participant/public APIs remain unchanged
  verification:
    - CI run 53 passed backend, frontend and end-to-end
step_40:
  changes:
    - authenticated principal now exposes system_admin
    - /api/system routes require an authenticated admin session
    - GET /api/system/accounts lists survey accounts for system admins
    - POST /api/system/accounts atomically creates a survey account and first ADMIN membership
    - existing active admin users can be linked as first account admin
    - new admin users require an initial password of at least 12 characters
    - ordinary survey administrators receive SYSTEM_ADMIN_REQUIRED
    - auth /me exposes systemAdmin for later frontend UX
  invariants:
    - only system_admin=true may create survey accounts
    - every newly created survey account has at least one ADMIN before commit
    - account and first-admin creation use one explicit database transaction
    - newly created account admins are not system administrators
  verification:
    - system-admin creation integration test added
    - ordinary-admin authorization test added
    - failed creation cleanup test added
    - CI run 60 passed backend, frontend and end-to-end
step_41:
  changes:
    - GET /api/admin/accounts/{accountId}/admins lists account administrators
    - POST /api/admin/accounts/{accountId}/admins links an existing active admin or creates a new admin user
    - DELETE /api/admin/accounts/{accountId}/admins/{adminUserId} removes account membership
    - all admin-management operations require membership in the target survey account
    - new admin users require an initial password of at least 12 characters
    - removing the final account administrator is blocked with LAST_ACCOUNT_ADMIN
    - account row locking serializes concurrent administrator removals
  invariants:
    - only administrators already linked to an account may manage its administrators
    - the same admin_user may belong to multiple survey accounts
    - membership removal does not delete the global admin_user
    - every survey account always retains at least one administrator
  verification:
    - add/list/remove integration test added
    - existing-user multi-account membership test added
    - last-admin protection test added
    - cross-account admin-management denial test added
    - CI run 67 passed backend, frontend and end-to-end
step_42:
  changes:
    - GET /api/admin/accounts lists survey accounts for the authenticated administrator
    - frontend survey and run clients now use account-scoped APIs exclusively
    - selected survey account is encoded in /admin/accounts/{accountId}
    - users with one account enter it automatically
    - users with multiple accounts receive an explicit account chooser
    - users with no accounts receive an informational no-account view
    - current account is visible in the admin header and users can switch accounts
    - account administrator management UI added
    - system administrator survey-account creation UI added
    - auth /me systemAdmin flag controls system-administration navigation
    - selected account remains tab-local because it is carried in the URL rather than server-side session state
  verification:
    - frontend TypeScript build passes
    - backend integration tests pass
    - existing workshop E2E flow passes through account-scoped APIs
    - Playwright multi-account scenario creates a second account, opens the account chooser and switches account
    - CI run 75 passed backend, frontend and end-to-end
next_step: STEP-43
next_step_name: User lifecycle
