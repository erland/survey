step_38:
  changes:
    - Flyway V8 adds survey_account and survey_account_admin
    - admin_user gains system_admin and active
    - survey gains mandatory survey_account_id and created_by_admin_user_id
    - existing surveys migrate to an initial Default account
    - existing admins are linked to the initial account during migration
    - configured bootstrap admin is promoted to system_admin and linked to the initial account on startup
    - new and copied surveys receive survey_account_id while legacy owner_id remains temporarily
    - inactive admin users are rejected by login/session authentication
    - Panache domain entities and repositories added for survey accounts and memberships
  transition:
    - owner_id remains until STEP-39 moves authorization to account membership
    - public participant behavior is unchanged
  verification:
    - migration schema tests added
    - survey account persistence tests added
    - bootstrap system-admin membership test added
    - CI pending
