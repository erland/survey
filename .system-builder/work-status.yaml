step_37:
  decisions:
    - survey_account owns surveys and downstream business data
    - admin_user is a global login identity
    - survey_account_admin links administrators to one or more survey accounts
    - only system/bootstrap admin may create new survey accounts
    - new survey account creation must atomically include at least one survey administrator
    - survey administrators may manage administrators only within accounts where they are members
    - an account may never be left without an administrator
    - selected account is explicit in routes/API requests rather than global server-side session state
    - tenant isolation is enforced server-side for survey, run, result and export access
    - existing data migrates to an initial account before owner_id is removed
  artifacts:
    - docs/multi-user-architecture.md
    - docs/development-plan.md updated with STEP-37..44
  verification:
    - architecture separates identity, membership and business-data ownership
    - migration path preserves existing surveys and results
    - systemadmin boundary is explicit
    - next implementation step is scoped to domain and Flyway migration
