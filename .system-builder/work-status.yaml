step_46:
  changes:
    - survey_run.survey_id now cascades when a survey is deleted
    - deleting a survey removes its runs, participant sessions, responses, response values and presentation tokens through existing cascade relations
    - regression coverage verifies runs disappear when their survey is deleted
    - survey deletion confirmation explicitly warns that runs and collected responses are permanently removed
  invariants:
    - survey deletion is a permanent aggregate deletion
    - no orphan survey runs or participant data remain after survey deletion
  verification:
    - CI run 125 passed backend, frontend and end-to-end

step_47:
  changes:
    - minimum password length for newly created regular administrators is reduced from 12 to 8 characters
    - newly created regular administrators must use a normalized email address as their login identifier
    - existing legacy administrator usernames remain usable and may still be linked to additional survey accounts
    - bootstrap/system administrator usernames remain exempt from the email requirement
    - admin_user.password_hash is nullable to support accounts that have not set their first password yet
    - admin_password_token stores hashed, expiring, single-use-capable INITIAL_PASSWORD and PASSWORD_RESET tokens
    - issuing a new password token revokes earlier unused tokens for the same administrator
    - password token lifetime is configurable and defaults to 24 hours
    - passwordless administrators cannot authenticate with the ordinary password login flow
  invariants:
    - clear password tokens are never stored in the database
    - bootstrap administrator identity remains configuration-driven and may be a non-email username
    - legacy non-email administrators remain compatible
    - new ordinary administrators require an email identity
    - password token UI and consumption endpoints are deferred to subsequent steps
  verification:
    - migration coverage checks password-token schema and nullable password hashes
    - policy coverage checks eight-character passwords and email requirement
    - token service coverage checks hash-only persistence and revocation of older tokens
    - CI run 128 passed backend, frontend and end-to-end

step_48:
  changes:
    - newly created regular administrators are created without a preassigned password
    - system-account and account-admin creation return a one-time initial-password path and expiry for new users
    - the administration UI shows the initial-password URL and provides a copy-link action
    - /admin/set-password lets the invited administrator choose their first password
    - POST /api/auth/password-token/consume validates and consumes the one-time token
    - successful token use stores the password hash, marks the token used and revokes existing sessions
    - existing administrators added to another account do not receive a new initial-password token
    - system-account creation no longer refreshes unrelated parent account membership state, keeping the invite link visible
  invariants:
    - initial-password tokens expire and can be used only once
    - clear tokens are returned only to the creating client and are never stored in the database
    - regular administrator passwords require at least 8 characters
    - bootstrap/system administrator remains configuration-driven and exempt from the email-only creation rule
    - legacy non-email administrators remain linkable to additional accounts
  verification:
    - backend integration tests cover passwordless creation, setup-link consumption, eight-character password acceptance and single-use rejection
    - account-admin integration tests cover the same initial-password flow
    - Playwright covers creation, visible setup link, setting the password and subsequent login
    - CI run 140 exposed an invite-link visibility defect in E2E
    - repair keeps the setup link visible after account creation
    - CI run 141 passed backend, frontend and end-to-end

step_49:
  changes:
    - system administrators can generate a PASSWORD_RESET link for an existing active regular administrator
    - password-reset links reuse the same expiring hashed-token infrastructure and /admin/set-password flow as initial-password links
    - system administration exposes a create-reset-link action and a copyable reset URL
    - consuming a reset link replaces the password hash and revokes all active sessions for the target administrator
    - inactive administrators must be reactivated before a reset link can be created
    - bootstrap/system administrator accounts are excluded from this lifecycle flow
  invariants:
    - password-reset links are time-limited and single-use
    - issuing a new token revokes older unused password tokens for the same administrator
    - clear reset tokens are never stored in the database
    - an unused reset link does not invalidate the current password or sessions
    - successful password reset invalidates the old password and existing sessions
  verification:
    - backend integration tests cover reset-link creation, old-session revocation, old-password rejection, new-password login and single-use enforcement
    - backend integration tests reject reset-link creation for inactive and system-administrator accounts
    - Playwright covers system-admin reset-link creation, password replacement and login with the new password
    - CI run 148 passed backend, frontend and end-to-end

step_50:
  changes:
    - every signed-in administrator, including the bootstrap/system administrator, can change their own password
    - password change requires the current password and a new password of at least 8 characters
    - the current authenticated session remains valid after a successful change
    - all other active sessions for the administrator are revoked
    - unused initial-password and password-reset tokens for the administrator are revoked
    - password-change navigation is available from account selection, account administration and system administration
    - returning from password change preserves the appropriate administration context
  invariants:
    - knowledge of the current password is required for self-service password change
    - the previous password no longer authenticates after a successful change
    - a password change cannot leave another active session or unused reset token usable
    - bootstrap/system administrator remains configuration-created but may change its persisted password after creation
  verification:
    - backend integration test covers incorrect-current-password rejection, successful change, preservation of the current session, revocation of another session, old-password rejection and new-password login
    - Playwright covers self-service password change through the signed-in UI
    - CI run 156 passed backend, frontend and end-to-end

step_51:
  changes:
    - bootstrap/system administrator gets a dedicated /admin/system/accounts survey-account administration route
    - survey-account administration navigation is labeled Enkätkonton and remains available even when the bootstrap administrator belongs to only one account
    - direct access to the survey-account page is rejected in the UI for non-system administrators
    - system account overview now shows both survey count and administrator count per account
    - the page explains that survey administrators only receive access to accounts they are explicitly linked to
    - existing account creation and first-administrator setup-link behavior remains unchanged
  invariants:
    - only the bootstrap/system administrator may use /api/system account-management operations
    - ordinary survey administrators cannot gain access to another survey account merely because their admin_user exists globally
    - account membership remains explicit through survey_account_admin
    - creating or linking an existing administrator does not broaden access beyond the target account
  verification:
    - backend coverage checks survey and administrator counts in the system account overview
    - Playwright covers the dedicated survey-account administration route
    - CI run 159 passed backend, frontend and end-to-end

step_52:
  changes:
    - bootstrap/system administrator can rename survey accounts
    - bootstrap/system administrator can delete a survey account even when it contains surveys and administrator memberships
    - account deletion requires explicit confirmation in both UI and backend
    - UI warning states that surveys, runs and collected responses will be removed permanently
    - account deletion removes surveys first so existing survey aggregate cascades remove runs, participant sessions, responses and presentation data
    - deleting the survey_account then removes survey_account_admin memberships through the existing database cascade
    - global admin_user identities are preserved even when their account membership is removed
  invariants:
    - destructive account deletion is unavailable without explicit confirmation
    - deleting one account never grants or removes access to a different account
    - deleting an account never deletes global administrator identities
    - all survey data owned by the deleted account is removed atomically
  verification:
    - backend integration test covers rename
    - backend integration test covers confirmation requirement and deletion of an account containing an administrator, survey and run
    - backend integration test verifies the administrator identity and login remain after account deletion
    - Playwright covers rename and confirmed account deletion controls
    - CI run 167 passed backend, frontend and end-to-end
