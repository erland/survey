history_summary:
  - STEP-01..03: bootstrap, CI, PostgreSQL and Flyway
  - STEP-04..08: admin authentication, survey domain/API and editor
  - STEP-09..13: survey-run snapshot, lifecycle, public lookup and sharing
  - STEP-14..18: anonymous participant session, participant UI, autosave, submit and heartbeat
